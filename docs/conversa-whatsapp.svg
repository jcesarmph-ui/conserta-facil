<svg xmlns="http://www.w3.org/2000/svg" width="460" height="1968" viewBox="0 0 460 1968" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="460" height="1968" fill="#ECE5DD"/>
  <rect width="460" height="64" fill="#075E54"/>
  <circle cx="36" cy="32" r="20" fill="#25D366"/>
  <text x="36" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">CF</text>
  <text x="66" y="28" font-size="16" font-weight="700" fill="#FFFFFF">Conserta Fácil</text>
  <text x="66" y="46" font-size="12" fill="#B2DFDB">online</text>
  <rect x="104" y="80" width="340" height="42" rx="10" fill="#DCF8C6"/><text y="100" font-size="14" fill="#111B21"><tspan x="116" dy="0">Oi</tspan></text>
  <rect x="16" y="132" width="340" height="202" rx="10" fill="#FFFFFF"/><text y="152" font-size="14" fill="#111B21"><tspan x="28" dy="0">1. Solicitar orçamento</tspan><tspan x="28" dy="20">2. Acompanhar reparo</tspan><tspan x="28" dy="20">3. Agendar entrega do aparelho</tspan><tspan x="28" dy="20">4. Endereço e horário</tspan><tspan x="28" dy="20">5. Falar com a equipe</tspan><tspan x="28" dy="20">0. Sair</tspan><tspan x="28" dy="20">Digite uma opção ou conte o problema do</tspan><tspan x="28" dy="20">celular.</tspan><tspan x="28" dy="20">Digite menu para voltar ao menu inicial.</tspan></text>
  <rect x="104" y="344" width="340" height="42" rx="10" fill="#DCF8C6"/><text y="364" font-size="14" fill="#111B21"><tspan x="116" dy="0">1</tspan></text>
  <rect x="16" y="396" width="340" height="62" rx="10" fill="#FFFFFF"/><text y="416" font-size="14" fill="#111B21"><tspan x="28" dy="0">QUAL O MODELO DO SEU CELULAR?</tspan><tspan x="28" dy="20">Digite menu para voltar ao menu inicial.</tspan></text>
  <rect x="104" y="468" width="340" height="42" rx="10" fill="#DCF8C6"/><text y="488" font-size="14" fill="#111B21"><tspan x="116" dy="0">Galaxy A54</tspan></text>
  <rect x="16" y="520" width="340" height="142" rx="10" fill="#FFFFFF"/><text y="540" font-size="14" fill="#111B21"><tspan x="28" dy="0">Qual é o tipo de problema?</tspan><tspan x="28" dy="20">1. Tela ou toque</tspan><tspan x="28" dy="20">2. Bateria ou carregamento</tspan><tspan x="28" dy="20">3. Contato com líquido</tspan><tspan x="28" dy="20">4. Outro problema</tspan><tspan x="28" dy="20">Digite menu para voltar ao menu inicial.</tspan></text>
  <rect x="104" y="672" width="340" height="42" rx="10" fill="#DCF8C6"/><text y="692" font-size="14" fill="#111B21"><tspan x="116" dy="0">1</tspan></text>
  <rect x="16" y="724" width="340" height="82" rx="10" fill="#FFFFFF"/><text y="744" font-size="14" fill="#111B21"><tspan x="28" dy="0">A tela ainda mostra imagem e responde ao</tspan><tspan x="28" dy="20">toque?</tspan><tspan x="28" dy="20">Digite menu para voltar ao menu inicial.</tspan></text>
  <rect x="104" y="816" width="340" height="62" rx="10" fill="#DCF8C6"/><text y="836" font-size="14" fill="#111B21"><tspan x="116" dy="0">A tela trincou depois que o celular caiu</tspan><tspan x="116" dy="20">no chão</tspan></text>
  <rect x="16" y="888" width="340" height="202" rx="10" fill="#FFFFFF"/><text y="908" font-size="14" fill="#111B21"><tspan x="28" dy="0">Modelo: Galaxy A54</tspan><tspan x="28" dy="20">Tipo de problema: Tela ou toque</tspan><tspan x="28" dy="20">Descrição: A tela trincou depois que o</tspan><tspan x="28" dy="20">celular caiu no chão</tspan><tspan x="28" dy="20">A equipe precisa avaliar o aparelho para</tspan><tspan x="28" dy="20">informar o valor.</tspan><tspan x="28" dy="20">Digite 1 para registrar, 2 para corrigir</tspan><tspan x="28" dy="20">ou 3 para cancelar.</tspan><tspan x="28" dy="20">Digite menu para voltar ao menu inicial.</tspan></text>
  <rect x="104" y="1100" width="340" height="42" rx="10" fill="#DCF8C6"/><text y="1120" font-size="14" fill="#111B21"><tspan x="116" dy="0">1</tspan></text>
  <rect x="16" y="1152" width="340" height="242" rx="10" fill="#FFFFFF"/><text y="1172" font-size="14" fill="#111B21"><tspan x="28" dy="0">Pedido registrado para avaliação.</tspan><tspan x="28" dy="20">Protocolo: 80727350</tspan><tspan x="28" dy="20">1. Solicitar orçamento</tspan><tspan x="28" dy="20">2. Acompanhar reparo</tspan><tspan x="28" dy="20">3. Agendar entrega do aparelho</tspan><tspan x="28" dy="20">4. Endereço e horário</tspan><tspan x="28" dy="20">5. Falar com a equipe</tspan><tspan x="28" dy="20">0. Sair</tspan><tspan x="28" dy="20">Digite uma opção ou conte o problema do</tspan><tspan x="28" dy="20">celular.</tspan><tspan x="28" dy="20">Digite menu para voltar ao menu inicial.</tspan></text>
  <rect x="104" y="1404" width="340" height="42" rx="10" fill="#DCF8C6"/><text y="1424" font-size="14" fill="#111B21"><tspan x="116" dy="0">2</tspan></text>
  <rect x="16" y="1456" width="340" height="82" rx="10" fill="#FFFFFF"/><text y="1476" font-size="14" fill="#111B21"><tspan x="28" dy="0">Digite somente o número do protocolo que</tspan><tspan x="28" dy="20">você recebeu.</tspan><tspan x="28" dy="20">Digite menu para voltar ao menu inicial.</tspan></text>
  <rect x="104" y="1548" width="340" height="42" rx="10" fill="#DCF8C6"/><text y="1568" font-size="14" fill="#111B21"><tspan x="116" dy="0">80727350</tspan></text>
  <rect x="16" y="1600" width="340" height="342" rx="10" fill="#FFFFFF"/><text y="1620" font-size="14" fill="#111B21"><tspan x="28" dy="0">Protocolo: 80727350</tspan><tspan x="28" dy="20">Status: Aguardando avaliação</tspan><tspan x="28" dy="20">Modelo: Galaxy A54</tspan><tspan x="28" dy="20">Tipo de problema: Tela ou toque</tspan><tspan x="28" dy="20">Descrição: A tela trincou depois que o</tspan><tspan x="28" dy="20">celular caiu no chão</tspan><tspan x="28" dy="20"></tspan><tspan x="28" dy="20">1. Solicitar orçamento</tspan><tspan x="28" dy="20">2. Acompanhar reparo</tspan><tspan x="28" dy="20">3. Agendar entrega do aparelho</tspan><tspan x="28" dy="20">4. Endereço e horário</tspan><tspan x="28" dy="20">5. Falar com a equipe</tspan><tspan x="28" dy="20">0. Sair</tspan><tspan x="28" dy="20">Digite uma opção ou conte o problema do</tspan><tspan x="28" dy="20">celular.</tspan><tspan x="28" dy="20">Digite menu para voltar ao menu inicial.</tspan></text>
