<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Mapa mental do projeto Conserta Fácil</title>

  <!-- Linhas de ligação (desenhadas primeiro, ficam atrás dos balões) -->
  <g stroke="#CBD5E1" stroke-width="3" fill="none">
    <line x1="500" y1="300" x2="170" y2="247"/>
    <line x1="500" y1="300" x2="500" y2="247"/>
    <line x1="500" y1="300" x2="830" y2="247"/>
    <line x1="500" y1="300" x2="170" y2="435"/>
    <line x1="500" y1="300" x2="500" y2="435"/>
    <line x1="500" y1="300" x2="830" y2="435"/>
  </g>

  <!-- Centro -->
  <rect x="370" y="262" width="260" height="76" rx="38" fill="#111827"/>
  <text x="500" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Conserta Fácil</text>
  <text x="500" y="320" text-anchor="middle" font-size="13" fill="#9CA3AF">chatbot de atendimento · WhatsApp</text>

  <!-- Atendimento (roxo) -->
  <rect x="40" y="95" width="260" height="40" rx="12" fill="#7C3AED"/>
  <text x="170" y="121" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Atendimento</text>
  <rect x="40" y="135" width="260" height="112" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <g font-size="13" fill="#1F2937">
    <text x="60" y="164">● Menu com cinco opções</text>
    <text x="60" y="189">● Orçamento com resumo e confirmação</text>
    <text x="60" y="214">● Consulta de reparo por protocolo</text>
    <text x="60" y="239">● Agenda com horário reservado</text>
  </g>

  <!-- Integração (verde) -->
  <rect x="370" y="95" width="260" height="40" rx="12" fill="#16A34A"/>
  <text x="500" y="121" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Integração</text>
  <rect x="370" y="135" width="260" height="112" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <g font-size="13" fill="#1F2937">
    <text x="390" y="164">● Webhook HTTPS em /webhook</text>
    <text x="390" y="189">● Assinatura HMAC SHA-256</text>
    <text x="390" y="214">● Envio pela Graph API da Meta</text>
    <text x="390" y="239">● Fila por cliente, em ordem</text>
  </g>

  <!-- Dados (azul) -->
  <rect x="700" y="95" width="260" height="40" rx="12" fill="#0284C7"/>
  <text x="830" y="121" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Dados</text>
  <rect x="700" y="135" width="260" height="112" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <g font-size="13" fill="#1F2937">
    <text x="720" y="164">● Pedidos com protocolo (JSON Lines)</text>
    <text x="720" y="189">● Agenda com reserva atômica</text>
    <text x="720" y="214">● Loja e clientes fictícios</text>
    <text x="720" y="239">● Credenciais fora do Git</text>
  </g>

  <!-- Qualidade (vermelho) -->
  <rect x="40" y="395" width="260" height="40" rx="12" fill="#DC2626"/>
  <text x="170" y="421" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Verificação</text>
  <rect x="40" y="435" width="260" height="112" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <g font-size="13" fill="#1F2937">
    <text x="60" y="464">● Simulação do fluxo completo</text>
    <text x="60" y="489">● Assinatura inválida recusada (403)</text>
    <text x="60" y="514">● Mensagens repetidas não são reenviadas</text>
    <text x="60" y="539">● Conversa registrada em SIMULACAO.md</text>
  </g>

  <!-- IA (âmbar) -->
  <rect x="370" y="395" width="260" height="40" rx="12" fill="#D97706"/>
  <text x="500" y="421" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Inteligência artificial</text>
  <rect x="370" y="435" width="260" height="112" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <g font-size="13" fill="#1F2937">
    <text x="390" y="464">● Identifica intenção de orçamento</text>
    <text x="390" y="489">● Extrai modelo, defeito e descrição</text>
    <text x="390" y="514">● Saída em JSON Schema</text>
    <text x="390" y="539">● Sem chave, usa o fluxo guiado</text>
  </g>

  <!-- Decisões (teal) -->
  <rect x="700" y="395" width="260" height="40" rx="12" fill="#0D9488"/>
  <text x="830" y="421" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Decisões de negócio</text>
  <rect x="700" y="435" width="260" height="112" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
  <g font-size="13" fill="#1F2937">
    <text x="720" y="464">● Confirmação antes do registro</text>
    <text x="720" y="489">● Valor definido após avaliação</text>
    <text x="720" y="514">● Protocolo para acompanhar o reparo</text>
    <text x="720" y="539">● Consulta só para quem fez o pedido</text>
  </g>
</svg>
